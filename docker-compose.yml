services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MUSICPLAYER_POSTGRES_DB:-musicplayer}
      POSTGRES_USER: ${MUSICPLAYER_POSTGRES_USER:-musicplayer}
      POSTGRES_PASSWORD: ${MUSICPLAYER_POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  navidrome:
    image: deluan/navidrome:latest
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: 1m
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - ${MUSICPLAYER_MUSIC_ROOT:-./data/music}:/music
      - navidrome_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4533/ping >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      DATABASE_URL: postgresql://${MUSICPLAYER_POSTGRES_USER:-musicplayer}:${MUSICPLAYER_POSTGRES_PASSWORD:-change-me}@postgres:5432/${MUSICPLAYER_POSTGRES_DB:-musicplayer}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/migrate.mjs"]
    profiles: ["ops"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_BASE_PATH: ${MUSICPLAYER_BASE_PATH:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${MUSICPLAYER_POSTGRES_USER:-musicplayer}:${MUSICPLAYER_POSTGRES_PASSWORD:-change-me}@postgres:5432/${MUSICPLAYER_POSTGRES_DB:-musicplayer}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_BASE_PATH: ${MUSICPLAYER_BASE_PATH:-}
      MUSIC_CATALOG_PROVIDER: ${MUSIC_CATALOG_PROVIDER:-deezer}
      NAVIDROME_URL: http://navidrome:4533
      WORKER_URL: http://worker:4000
      MUSIC_ROOT: /music
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      ACQUISITION_ENABLED: ${ACQUISITION_ENABLED:-false}
      AUTHORIZED_ACQUISITION: ${AUTHORIZED_ACQUISITION:-false}
      PREFETCH_SIZE: ${PREFETCH_SIZE:-5}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      JELLYFIN_URL: ${JELLYFIN_URL:-http://192.168.0.148:8096}
      SEERR_URL: ${SEERR_URL:-http://192.168.0.148:5055}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      SEERR_ALLOWED_ORIGINS: ${SEERR_ALLOWED_ORIGINS:-}
    volumes:
      - ${MUSICPLAYER_MUSIC_ROOT:-./data/music}:/music:ro
    depends_on:
      postgres:
        condition: service_healthy
      navidrome:
        condition: service_started
    ports:
      - "127.0.0.1:${MUSICPLAYER_WEB_PORT:-3090}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000${MUSICPLAYER_BASE_PATH:-}/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${MUSICPLAYER_POSTGRES_USER:-musicplayer}:${MUSICPLAYER_POSTGRES_PASSWORD:-change-me}@postgres:5432/${MUSICPLAYER_POSTGRES_DB:-musicplayer}
      MUSIC_ROOT: /music
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      ACQUISITION_ENABLED: ${ACQUISITION_ENABLED:-false}
      AUTHORIZED_ACQUISITION: ${AUTHORIZED_ACQUISITION:-false}
      SPOTDL_COMMAND: ${SPOTDL_COMMAND:-spotdl}
      SPOTDL_OUTPUT: /music
      SPOTDL_MAX_CONCURRENT: ${SPOTDL_MAX_CONCURRENT:-1}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      WORKER_PORT: 4000
    volumes:
      - ${MUSICPLAYER_MUSIC_ROOT:-./data/music}:/music
    depends_on:
      postgres:
        condition: service_healthy
      navidrome:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  navidrome_data:
